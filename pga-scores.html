<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGA Championship - Score Comparison</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f5c518;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 24px;
    }

    .last-updated {
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 16px;
    }

    .refresh-btn {
      display: block;
      margin: 0 auto 28px;
      padding: 10px 28px;
      background: #f5c518;
      color: #0f1117;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.15s, transform 0.1s;
    }
    .refresh-btn:hover { background: #ffd740; }
    .refresh-btn:active { transform: scale(0.97); }
    .refresh-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

    .teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto 28px;
    }

    @media (max-width: 640px) {
      .teams-grid { grid-template-columns: 1fr; }
    }

    .team-card {
      background: #1a1d27;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2d3a;
    }

    .team-header {
      padding: 14px 18px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.03em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-you .team-header { background: #1a3a5c; border-bottom: 2px solid #2979ff; }
    .team-andrew .team-header { background: #3a1a1a; border-bottom: 2px solid #e53935; }

    .team-total {
      font-size: 1.3rem;
      font-weight: 800;
    }
    .team-total.under { color: #4caf50; }
    .team-total.over  { color: #f44336; }
    .team-total.even  { color: #e8eaf0; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      padding: 8px 12px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      text-align: left;
      background: #13151e;
      border-bottom: 1px solid #2a2d3a;
    }

    tbody tr {
      border-bottom: 1px solid #20232f;
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #20232f; }

    td {
      padding: 10px 12px;
      font-size: 0.88rem;
    }

    .player-name { font-weight: 600; }

    .score-cell {
      font-weight: 800;
      font-size: 1rem;
      text-align: center;
    }
    .score-cell.under { color: #4caf50; }
    .score-cell.over  { color: #f44336; }
    .score-cell.even  { color: #e8eaf0; }

    .round-cell, .thru-cell { color: #aaa; font-size: 0.82rem; }

    .summary-bar {
      max-width: 900px;
      margin: 0 auto;
      background: #1a1d27;
      border-radius: 12px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid #2a2d3a;
      flex-wrap: wrap;
      gap: 12px;
    }

    .summary-item { text-align: center; }
    .summary-label { font-size: 0.72rem; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .summary-value { font-size: 1.5rem; font-weight: 800; }
    .summary-value.under { color: #4caf50; }
    .summary-value.over  { color: #f44336; }
    .summary-value.even  { color: #e8eaf0; }
    .summary-winner { font-size: 0.8rem; color: #f5c518; font-weight: 600; margin-top: 4px; }

    .error-msg {
      text-align: center;
      color: #f44336;
      font-size: 0.82rem;
      margin-top: 8px;
    }

    .loading-row td { color: #555; font-style: italic; text-align: center; }

    .cut-badge {
      display: inline-block;
      background: #5a2020;
      color: #e57373;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .wd-badge {
      display: inline-block;
      background: #3a3a20;
      color: #bdbdbd;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <h1>PGA Championship 2025</h1>
  <p class="subtitle">Pick'em Score Comparison</p>
  <p class="last-updated" id="lastUpdated">Not yet loaded</p>

  <button class="refresh-btn" id="refreshBtn" onclick="loadScores()">&#8635; Refresh Scores</button>
  <p class="error-msg" id="errorMsg"></p>

  <div class="teams-grid">
    <div class="team-card team-you" id="cardYou">
      <div class="team-header">
        <span>You</span>
        <span class="team-total" id="totalYou">—</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th style="text-align:center">Score</th>
            <th>Round</th>
            <th>Thru</th>
          </tr>
        </thead>
        <tbody id="tbodyYou">
          <tr class="loading-row"><td colspan="4">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="team-card team-andrew" id="cardAndrew">
      <div class="team-header">
        <span>Andrew</span>
        <span class="team-total" id="totalAndrew">—</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th style="text-align:center">Score</th>
            <th>Round</th>
            <th>Thru</th>
          </tr>
        </thead>
        <tbody id="tbodyAndrew">
          <tr class="loading-row"><td colspan="4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="summary-bar">
    <div class="summary-item">
      <div class="summary-label">You</div>
      <div class="summary-value" id="sumYou">—</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">vs</div>
      <div class="summary-winner" id="winnerLabel">—</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">Andrew</div>
      <div class="summary-value" id="sumAndrew">—</div>
    </div>
  </div>

<script>
  // ── Team definitions ──────────────────────────────────────────────────────
  // Search keys are lowercased substrings to match ESPN display names
  const YOU = [
    { label: "Scottie Scheffler", keys: ["scheffler"] },
    { label: "Xander Schauffele", keys: ["schauffele"] },
    { label: "Shane Lowry",       keys: ["lowry"] },
    { label: "Joaquin Niemann",   keys: ["niemann"] },
    { label: "Cam Young",         keys: ["young, cam", "cameron young", "cam young"] },
  ];

  const ANDREW = [
    { label: "Patrick Reed",   keys: ["reed, p", "patrick reed"] },
    { label: "Brooks Koepka",  keys: ["koepka"] },
    { label: "Jon Rahm",       keys: ["rahm"] },
    { label: "Justin Thomas",  keys: ["j. thomas", "justin thomas", "thomas, j"] },
    { label: "Jordan Spieth",  keys: ["spieth"] },
  ];

  // ── ESPN API ──────────────────────────────────────────────────────────────
  const ESPN_URL = "https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard?league=pga";

  function scoreClass(n) {
    if (n == null) return "even";
    if (n < 0) return "under";
    if (n > 0) return "over";
    return "even";
  }

  function fmtScore(n) {
    if (n == null) return "—";
    if (n === 0) return "E";
    return n > 0 ? "+" + n : String(n);
  }

  function findPlayer(competitors, playerDef) {
    const lower = (s) => s.toLowerCase();
    for (const c of competitors) {
      const fullName = lower(c.athlete?.displayName || "");
      const lastName = lower(c.athlete?.lastName || "");
      if (playerDef.keys.some(k => fullName.includes(k) || lastName.includes(k))) {
        return c;
      }
    }
    return null;
  }

  function parseCompetitor(c) {
    if (!c) return { score: null, round: "—", thru: "—", status: "" };

    const stats  = c.statistics || [];
    const status = (c.status?.type?.description || "").toLowerCase();
    const isCut  = status.includes("cut") || c.status?.type?.id === "C";
    const isWD   = status.includes("wd") || status.includes("withdraw");

    // score to par
    let score = null;
    const scoreStat = stats.find(s => s.name === "scoreToPar" || s.abbreviation === "TOT");
    if (scoreStat) {
      score = parseInt(scoreStat.displayValue, 10);
      if (isNaN(score)) score = null;
    }
    // fallback: linescores
    if (score == null && c.linescores) {
      score = c.linescores.reduce((a, ls) => {
        const v = parseInt(ls.displayValue, 10);
        return a + (isNaN(v) ? 0 : v);
      }, 0);
    }

    const round = c.status?.period ? "R" + c.status.period : "—";

    let thru = "—";
    if (c.status?.type?.id === "F" || c.status?.type?.description === "Final") {
      thru = "F";
    } else if (c.status?.displayClock) {
      thru = c.status.displayClock;
    } else if (typeof c.status?.hole === "number") {
      thru = c.status.hole === 0 ? "—" : c.status.hole;
    }

    return { score, round, thru, isCut, isWD };
  }

  function renderTable(tbodyId, players, competitors) {
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = "";
    let total = 0;
    let totalKnown = false;

    for (const p of players) {
      const c = findPlayer(competitors, p);
      const { score, round, thru, isCut, isWD } = parseCompetitor(c);

      if (score != null && !isCut) { total += score; totalKnown = true; }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="player-name">
          ${p.label}
          ${isCut ? '<span class="cut-badge">CUT</span>' : ""}
          ${isWD  ? '<span class="wd-badge">WD</span>'  : ""}
        </td>
        <td class="score-cell ${scoreClass(score)}">${fmtScore(score)}</td>
        <td class="round-cell">${round}</td>
        <td class="thru-cell">${thru}</td>
      `;
      tbody.appendChild(tr);
    }

    return totalKnown ? total : null;
  }

  function setTotal(elId, total) {
    const el = document.getElementById(elId);
    if (total == null) { el.textContent = "—"; el.className = "team-total even"; return; }
    el.textContent = fmtScore(total);
    el.className = "team-total " + scoreClass(total);
  }

  function setSummary(totalYou, totalAndrew) {
    const sy = document.getElementById("sumYou");
    const sa = document.getElementById("sumAndrew");
    const wl = document.getElementById("winnerLabel");

    if (totalYou != null) {
      sy.textContent = fmtScore(totalYou);
      sy.className = "summary-value " + scoreClass(totalYou);
    } else {
      sy.textContent = "—"; sy.className = "summary-value even";
    }

    if (totalAndrew != null) {
      sa.textContent = fmtScore(totalAndrew);
      sa.className = "summary-value " + scoreClass(totalAndrew);
    } else {
      sa.textContent = "—"; sa.className = "summary-value even";
    }

    if (totalYou != null && totalAndrew != null) {
      if (totalYou < totalAndrew)       wl.textContent = "You lead by " + (totalAndrew - totalYou);
      else if (totalAndrew < totalYou)  wl.textContent = "Andrew leads by " + (totalYou - totalAndrew);
      else                              wl.textContent = "All square";
    } else {
      wl.textContent = "—";
    }
  }

  async function loadScores() {
    const btn = document.getElementById("refreshBtn");
    const err = document.getElementById("errorMsg");
    btn.disabled = true;
    btn.textContent = "Loading…";
    err.textContent = "";

    document.getElementById("tbodyYou").innerHTML    = '<tr class="loading-row"><td colspan="4">Loading…</td></tr>';
    document.getElementById("tbodyAndrew").innerHTML = '<tr class="loading-row"><td colspan="4">Loading…</td></tr>';

    try {
      const res = await fetch(ESPN_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("ESPN API returned " + res.status);
      const data = await res.json();

      // Drill into the event competitors
      const events = data?.events || [];
      // Find PGA Championship (major)
      let event = events.find(e =>
        (e.name || "").toLowerCase().includes("pga championship") ||
        (e.shortName || "").toLowerCase().includes("pga")
      ) || events[0];

      if (!event) throw new Error("No golf event found in ESPN response");

      const competition = event?.competitions?.[0];
      const competitors = competition?.competitors || [];

      if (competitors.length === 0) throw new Error("No competitor data yet – tournament may not have started");

      const totalYou    = renderTable("tbodyYou",    YOU,    competitors);
      const totalAndrew = renderTable("tbodyAndrew", ANDREW, competitors);

      setTotal("totalYou",    totalYou);
      setTotal("totalAndrew", totalAndrew);
      setSummary(totalYou, totalAndrew);

      const now = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      document.getElementById("lastUpdated").textContent = "Last updated: " + now;
    } catch (e) {
      err.textContent = "Could not load scores: " + e.message;
      document.getElementById("tbodyYou").innerHTML    = '<tr class="loading-row"><td colspan="4">—</td></tr>';
      document.getElementById("tbodyAndrew").innerHTML = '<tr class="loading-row"><td colspan="4">—</td></tr>';
    } finally {
      btn.disabled = false;
      btn.textContent = "↻ Refresh Scores";
    }
  }

  // Auto-load on page open
  loadScores();
</script>
</body>
</html>
